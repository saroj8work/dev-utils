[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-viewer-lambda"
version = "0.1.0"
description = "AWS Lambda API for formatting and previewing text documents"
requires-python = ">=3.12"
dependencies = [
  "bleach>=6.2,<7",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.115,<1",
  "mangum>=0.19,<1",
  "Markdown>=3.8,<4",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "httpx2>=2.13.1",
    "uvicorn>=0.34,<1",
]
