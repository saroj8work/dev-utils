[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-viewer-lambda"
version = "0.1.0"
description = "AWS Lambda API for formatting and previewing text documents"
requires-python = ">=3.12"
dependencies = [
  "bleach>=6.2,<7",
  "beautifulsoup4>=4.13,<5",
  "Markdown>=3.8,<4",
]
